name: "[daily] FixAnchor"
# src/Clean/fixAnchor.js

on:
  schedule:
    - cron: "35 19 * * *" # 03:35 CST
  workflow_dispatch:

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}

jobs:
  fix-anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_BOT: ${{ secrets.ZH_BOT }}
        run: npm start src/Clean/fixAnchor.js
