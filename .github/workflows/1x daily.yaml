name: "[daily] 1x"
# 0
# # Clean/purge.ts
# # File/mainpageImages.ts
# # Category/fixRedirect.ts
# 1
# # Clean/invisibleCharacter.ts
# # Personal/watch.ts
# # Clean/draftDelete.ts
# 4
# # Clean/sandbox.ts
# # Clean/brokenRedirectDelete.ts
# # Activity/maintainer.ts
# 6
# # Clean/urlUnquote.ts
# # Report/songCounter.ts

on:
  schedule:
    - cron: "35 16 * * *" # 00:35 CST
    - cron: "35 17 * * *" # 01:35 CST
    - cron: "50 20 * * *" # 04:50 CST
    - cron: "35 1 * * *" # 09:35 CST
  workflow_dispatch:
    inputs:
      task:
        description: "Select the task to run"
        type: choice
        required: true
        options:
          - watch
          - invisible-character
          - purge
          - mainpage-image-protection
          - fix-redirect-category
          - clean-sandbox
          - broken-redirect-deletion
          - check-activities
          - url-unquote
          - song-counter
          - draft-deletion

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  invisible-character:
    if: |
      github.event.schedule == '35 17 * * *' || 
      github.event.inputs.task == 'invisible-character'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          SITE: 'cm'
          CM_BOT: ${{ secrets.CM_BOT }}
        run: npm start src/Clean/invisibleCharacter.ts
  
  watch:
    needs: [invisible-character]
    if: |
      !cancelled() && (
        (github.event.schedule == '35 17 * * *' && needs.invisible-character.result == 'success') ||
        github.event.inputs.task == 'watch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_MAIN: ${{ secrets.ZH_MAIN }}
        run: npm start src/Personal/watch.ts

  purge:
    if: |
      github.event.schedule == '35 16 * * *' || 
      github.event.inputs.task == 'purge'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
        run: npm start src/Clean/purge.ts

  mainpage-image-protection:
    needs: purge
    if: |
      !cancelled() && (
        (github.event.schedule == '35 16 * * *' && needs.purge.result == 'success') ||
        github.event.inputs.task == 'mainpage-image-protection'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
          CM_ABOT: ${{ secrets.CM_ABOT }}
        run: npm start src/File/mainpageImages.ts

  fix-redirect-category:
    needs: mainpage-image-protection
    if: |
      !cancelled() && (
        (github.event.schedule == '35 16 * * *' && needs.mainpage-image-protection.result == 'success') ||
        github.event.inputs.task == 'fix-redirect-category'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_BOT: ${{ secrets.ZH_BOT }}
          CM_BOT: ${{ secrets.CM_BOT }}
        run: npm start src/Category/fixRedirect.ts

  clean-sandbox:
    if: |
      github.event.schedule == '50 20 * * *' ||
      github.event.inputs.task == 'clean-sandbox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
        run: npm start src/Clean/sandbox.ts

  broken-redirect-deletion:
    if: |
      github.event.schedule == '50 20 * * *' ||
      github.event.inputs.task == 'broken-redirect-deletion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
        run: npm start src/Clean/brokenRedirectDelete.ts

  check-activities:
    needs: [clean-sandbox, broken-redirect-deletion]
    if: |
      !cancelled() && (
        (github.event.schedule == '50 20 * * *' && needs.clean-sandbox.result == 'success' && needs.broken-redirect-deletion.result == 'success') ||
        github.event.inputs.task == 'check-activities'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
          CM_IBOT: ${{ secrets.CM_IBOT }}
        run: npm start src/Activity/maintainer.ts

  url-unquote:
    needs: song-counter
    if: |
      !cancelled() && (
        (github.event.schedule == '35 1 * * *' && needs.song-counter.result == 'success') ||
        github.event.inputs.task == 'url-unquote'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
          CM_IBOT: ${{ secrets.CM_IBOT }}
        run: npm start src/Clean/urlUnquote.ts

  song-counter:
    if: |
      github.event.schedule == '35 1 * * *' ||
      github.event.inputs.task == 'song-counter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
          CM_IBOT: ${{ secrets.CM_IBOT }}
        run: npm start src/Report/songCounter.ts

  draft-deletion:
    if: |
      github.event.schedule == '35 17 * * *' || 
      github.event.inputs.task == 'draft-deletion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
        run: npm start src/Clean/draftDelete.ts