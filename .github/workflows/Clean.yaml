name: "[schedule] Clean"
# src/Clean/fixArchiveAnchor.js

on:
  schedule:
    - cron: "55 21 * * 3" # Thursday 05:55 CST
  workflow_dispatch:
    inputs:
      task:
        description: "Select the task to run"
        type: choice
        required: true
        options:
          - fix-archive-anchor

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}

jobs:
  fix-archive-anchor:
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.task == 'fix-archive-anchor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_BOT: ${{ secrets.ZH_BOT }}
        run: npm start src/Clean/fixArchiveAnchor.js
