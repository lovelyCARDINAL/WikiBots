name: "[daily] 4x bwiki"
# valorant/userpageDelete.ts

on:
  schedule:
    - cron: "35 19,2,9,14 * * *" # 3:35, 10:35, 17:35, 22:35 CST
  workflow_dispatch:
    inputs:
      task:
        description: 'Select the task to run'
        type: choice
        required: true
        options:
          - valorant-userpage-deletion

permissions:
  contents: read

jobs:
  valorant-userpage-deletion:
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.task == 'valorant-userpage-deletion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          BWIKI_VALORANT_BOT: ${{ secrets.BWIKI_VALORANT_BOT }}
        run: npm start src_bwiki/valorant/userpageDelete.ts