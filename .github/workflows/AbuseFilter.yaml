name: "[schedule] AbuseFilter"

on:
  schedule:
    - cron: "35 12 * * 2,6" # Tuesday, Saturday 20:35 CST
    - cron: "35 15 10,25 * *" # 10th, 25th 23:50 CST
  workflow_dispatch:
    inputs:
      task:
        description: 'Select the task to run'
        type: choice
        required: true
        options:
          - update
          - global

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MOEGIRL_PASSWORD: ${{ secrets.MOEGIRL_PASSWORD }}

permissions:
  contents: read

jobs:
  update:
    if: |
      github.event.schedule == '35 12 * * 2,6' || 
      github.event.inputs.task == 'update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        run: npm start src/AbuseFilter/update.ts

  global:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '35 15 10,25 * *' || 
      github.event.inputs.task == 'global'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        run: npm start src/AbuseFilter/global.ts
