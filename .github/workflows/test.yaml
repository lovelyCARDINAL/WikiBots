name: Node TLS & Edit Test

on:
  workflow_dispatch:

jobs:
  test-node-versions:
    name: Node ${{ matrix.node }} (compat=${{ matrix.compat }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # OpenSSL 3.0.x 对照组
          - node: '20'
            compat: '0'
            node_opts: ''
          - node: '22.18.0'
            compat: '0'
            node_opts: ''
          - node: '24.4.1'
            compat: '0'
            node_opts: ''

          # 最新 LTS（OpenSSL 3.5.x）默认握手 vs 模拟 OpenSSL 3.0 参数
          - node: '22'
            compat: '0'
            node_opts: ''
          - node: '22'
            compat: '1'
            node_opts: '--tls-cipher-list=DEFAULT@SECLEVEL=1'

          - node: '24'
            compat: '0'
            node_opts: ''
          - node: '24'
            compat: '1'
            node_opts: '--tls-cipher-list=DEFAULT@SECLEVEL=1'

          - node: '26'
            compat: '0'
            node_opts: ''
          - node: '26'
            compat: '1'
            node_opts: '--tls-cipher-list=DEFAULT@SECLEVEL=1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Moegirlpedia edit test
        env:
          TLS_COMPAT: ${{ matrix.compat }}
          NODE_OPTIONS: ${{ matrix.node_opts }}
          MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
          ZH_BOT: ${{ secrets.ZH_BOT }}
        run: node src/Personal/test.js