name: Node TLS Minimal Test

on:
  workflow_dispatch:

jobs:
  test-minimal-tls:
    name: Node ${{ matrix.node }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # 仅去掉 X25519MLKEM768（不改 SECLEVEL）
          - node: '24'
            mode: 'curve_only'
            node_opts: ''
          - node: '26'
            mode: 'curve_only'
            node_opts: ''

          # 仅降级 SECLEVEL=1（保留默认 X25519MLKEM768）
          - node: '24'
            mode: 'cipher_only'
            node_opts: '--tls-cipher-list=DEFAULT@SECLEVEL=1'
          - node: '26'
            mode: 'cipher_only'
            node_opts: '--tls-cipher-list=DEFAULT@SECLEVEL=1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - name: Run Moegirlpedia edit test
        env:
          TLS_MODE: ${{ matrix.mode }}
          NODE_OPTIONS: ${{ matrix.node_opts }}
          MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
          ZH_BOT: ${{ secrets.ZH_BOT }}
        run: node src/Personal/test.js