name: "[schedule] Suppress"

on:
  schedule:
    - cron: "35 8 * * 1,5" # Monday, Friday 16:35 CST
    - cron: "35 8 * * 2,6" # Tuesday, Saturday 16:35 CST
    - cron: "35 8 * * 3,0" # Wednesday, Sunday 16:35 CST
  workflow_dispatch:
    inputs:
      task:
        description: 'Select the task to run'
        type: choice
        required: true
        options:
          - page-log
          - user-log
          - revoke-user

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MOEGIRL_PASSWORD: ${{ secrets.MOEGIRL_PASSWORD }}

permissions:
  contents: read

jobs:
  page-log:
    if: |
      github.event.schedule == '35 8 * * 1,5' || 
      github.event.inputs.task == 'page-log'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        run: npm start src/Suppress/pageLog.ts

  user-log:
    if: |
      github.event.schedule == '35 8 * * 3,0' || 
      github.event.inputs.task == 'user-log'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        run: npm start src/Suppress/userLog.ts

  revoke-user:
    if: |
      github.event.schedule == '35 8 * * 2,6' || 
      github.event.inputs.task == 'revoke-user'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        run: npm start src/Suppress/revokeUser.ts
