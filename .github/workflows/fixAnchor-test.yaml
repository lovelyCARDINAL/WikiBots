name: "[manually] Fix Anchor Test"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without editing pages or updating time.yaml"
        type: boolean
        required: true
        default: true
      self_test:
        description: "Run offline self-test for fix, talk-page notice, and auto-removal"
        type: boolean
        required: false
        default: false
      check_page:
        description: "Optional single page title to check"
        type: string
        required: false
        default: ""
      limit:
        description: "Max recent-changed pages to inspect"
        type: string
        required: false
        default: "100"

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fix-anchor-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Fix Anchor
        env:
          ZH_BOT: ${{ secrets.ZH_BOT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SELF_TEST: ${{ github.event.inputs.self_test }}
        run: |
          ARGS="--limit=${{ github.event.inputs.limit }}"
          if [ -n "${{ github.event.inputs.check_page }}" ]; then
            ARGS="$ARGS --check-page=${{ github.event.inputs.check_page }}"
          fi
          npm start src/Clean/fixAnchor.js -- $ARGS
