name: "[schedule] Report"

on:
  schedule:
    - cron: "55 21 * * 0" # Monday 05:55 CST
    - cron: "55 21 * * 1" # Tuesday 05:55 CST
    - cron: "55 21 * * 2" # Wednesday 05:55 CST
    - cron: "55 21 * * 6" # Sunday 05:55 CST
    - cron: "35 7 6,21 * *" # 6th & 21st of every month 15:35 CST
    - cron: "35 7 7,22 * *" # 7th & 22nd of every month 15:35 CST
    - cron: "35 7 23 * *" # 23th of every month 15:35 CST
  workflow_dispatch:
    inputs:
      task:
        description: 'Select the task to run'
        type: choice
        required: true
        default: none
        options:
          - none
          - bad-display-title
          - bad-file-name
          - broken-file-links
          - check-language-conversion
          - most-transcluded-pages
          - need-improve
          - need-improve-vtuber
          - need-improve-welcome
          - short-pages
          - tentative-title

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  bad-display-title:
    if: |
      github.event.schedule == '35 7 6,21 * *' || 
      github.event.inputs.task == 'bad-display-title'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/badDisplayTitle.ts

  bad-file-name:
    needs: most-transcluded-pages
    if: |
      !cancelled() && (
        (github.event.schedule == '55 21 * * 0' && needs.most-transcluded-pages.result == 'success') ||
        github.event.inputs.task == 'bad-file-name'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
          CM_IBOT: ${{ secrets.CM_IBOT }}
        run: npm start src/Report/badFileName.ts

  broken-file-links:
    needs: short-pages
    if: |
      !cancelled() && (
        (github.event_name == 'schedule' && needs.short-pages.result == 'success') 
        || github.event.inputs.task == 'broken-file-links'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
          CM_IBOT: ${{ secrets.CM_IBOT }}
        run: npm start src/Report/brokenFileLinks.ts

  most-transcluded-pages:
    if: |
      github.event.schedule == '55 21 * * 0' || 
      github.event.inputs.task == 'most-transcluded-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/mostTranscludedPages.ts

  need-improve:
    if: |
      github.event.schedule == '55 21 * * 2' || 
      github.event.inputs.task == 'need-improve'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/needImprove.ts

  need-improve-vtuber:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '35 7 23 * *' ||
      github.event.inputs.task == 'need-improve-vtuber'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/needImproveVtuber.ts

  need-improve-welcome:
    needs: need-improve
    if: |
      !cancelled() && (
        (github.event.schedule == '55 21 * * 2' && needs.need-improve.result == 'success') ||
        github.event.inputs.task == 'need-improve-welcome'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/needImproveWelcome.ts

  short-pages:
    if: |
      github.event.schedule == '55 21 * * 1' || 
      github.event.inputs.task == 'short-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/shortPages.ts

  tentative-title:
    if: |
      github.event.schedule == '35 7 7,22 * *' || 
      github.event.inputs.task == 'tentative-title'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/tentativeTitle.ts

  check-language-conversion:
    if: |
      github.event.schedule == '55 21 * * 6' ||
      github.event.inputs.task == 'check-language-conversion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_IBOT: ${{ secrets.ZH_IBOT }}
        run: npm start src/Report/checkLanguageConversion.ts
