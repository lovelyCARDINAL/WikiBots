name: "[schedule] Anchor"
# src/Clean/fixAnchor.js - 11:35 CST daily
# src/Clean/fixArchiveAnchor.js - 05:55 CST Thursday

on:
  schedule:
    - cron: "35 3 * * *" # 11:35 CST daily
    - cron: "55 21 * * 3" # Thursday 05:55 CST
  workflow_dispatch:
    inputs:
      task:
        description: "Select the task to run"
        type: choice
        required: true
        options:
          - fix-anchor
          - fix-archive-anchor

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fix-anchor:
    if: |
      github.event.schedule == '35 3 * * *' ||
      github.event.inputs.task == 'fix-anchor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_BOT: ${{ secrets.ZH_BOT }}
        run: npm start src/Clean/fixAnchor.js

  fix-archive-anchor:
    if: |
      github.event.schedule == '55 21 * * 3' ||
      github.event.inputs.task == 'fix-archive-anchor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Node Version
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_BOT: ${{ secrets.ZH_BOT }}
        run: npm start src/Clean/fixArchiveAnchor.js
