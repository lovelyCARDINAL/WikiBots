name: "[schedule] Anchor"
# src/Clean/fixAnchor.ts - 11:35 CST daily
# src/Clean/fixArchiveAnchor.ts - 05:55 CST Thursday

on:
  schedule:
    - cron: "35 3 * * *" # 11:35 CST daily
    - cron: "55 21 * * 3" # Thursday 05:55 CST
  workflow_dispatch:
    inputs:
      task:
        description: "Select the task to run"
        type: choice
        required: true
        options:
          - fix-anchor
          - fix-archive-anchor

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  fix-anchor:
    permissions:
      contents: write
    if: |
      github.event.schedule == '35 3 * * *' ||
      github.event.inputs.task == 'fix-anchor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
        run: npm start src/Clean/fixAnchor.ts

  fix-archive-anchor:
    if: |
      github.event.schedule == '55 21 * * 3' ||
      github.event.inputs.task == 'fix-archive-anchor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          ZH_ABOT: ${{ secrets.ZH_ABOT }}
        run: npm start src/Clean/fixArchiveAnchor.ts
