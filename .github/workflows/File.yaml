name: "[schedule] File"
# src/File/info.ts - 3x daily.yaml
# src/File/mainpageImages.ts - 1x evening.yaml

on:
  schedule:
    - cron: "35 4 * * 4" # Thursday 12:35 CST
  workflow_dispatch:
    inputs:
      task:
        description: 'Select the task to run'
        type: choice
        required: true
        options:
          - revision-deletion

env:
  MOEGIRL_API_USER_AGENT: ${{ secrets.MOEGIRL_API_USER_AGENT }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  revision-deletion:
    if: |
      github.event_name == 'schedule' || 
      github.event.inputs.task == 'revision-deletion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Script
        env:
          CM_ABOT: ${{ secrets.CM_ABOT }}
        run: npm start src/File/revisionDelete.ts
